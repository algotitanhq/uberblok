name: ci

# Every push: unit tests, the code in the Hall's figure, excerpt check on ANALYSIS.md, site build, permalink
# check and source check (against SOURCES.md) on the built HTML. Branches build
# and test only: previews are private, on the build machine (`preview`, see docs/dev.md).
# Deploy: `wrangler deploy` on a push to main (or a manual run on main, for the
# first deploy, RELEASE.md step 4), and only once the repository
# variable PUBLIC_RELEASE is "true" (the owner's only step: the Go on the first public
# release sets it on the public repository). Until then it is skipped. The Cloudflare keys,
# the secret CLOUDFLARE_API_TOKEN and the variable CLOUDFLARE_ACCOUNT_ID (not read here),
# come from the algotitanhq organization; never
# add repository-level copies (they would override the organization's). The site is
# <name>.storagebits.workers.dev (name in wrangler.jsonc). No workflow uploads preview versions.
# No step reads the variable CLOUDFLARE_ACCOUNT_ID: a run step's log header prints its env
# and its script with every expression filled in, so a value from `vars` would show in clear
# (an `::add-mask::` step fed from `vars` too, in its own header). The Deploy step asks
# Cloudflare for the token's single account, masks its ID, then runs wrangler (DECISIONS.md D19.1).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENZFS_SHA: 71a9f9578616a90c3c14bb59629fb4d31bfd68d1
  WRANGLER_VERSION: "4.142.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Fetch OpenZFS at the frozen commit
        run: |
          git init -q "$RUNNER_TEMP/openzfs"
          git -C "$RUNNER_TEMP/openzfs" fetch -q --depth 1 https://github.com/openzfs/zfs "$OPENZFS_SHA"
      - name: Test the checker
        run: npm test
      - name: Check the code printed in the Hall's figure against the frozen commit
        run: node scripts/check-plate.mjs "$RUNNER_TEMP/openzfs" "$OPENZFS_SHA" src/assets/glass-plate.json
      - name: Check every permalink and excerpt in ANALYSIS.md
        run: node scripts/check-permalinks.mjs "$RUNNER_TEMP/openzfs" "$OPENZFS_SHA" ANALYSIS.md
      - name: Install
        run: npm ci
      - name: Build
        # The analytics beacon (src/lib/analytics.ts) needs PUBLIC_RELEASE=true at build
        # time: only for the build that the Deploy step below ships, so this condition is
        # the Deploy step's own (keep the two identical). Any other build must have no beacon.
        env:
          PUBLIC_RELEASE: ${{ vars.PUBLIC_RELEASE == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'true' || '' }}
        run: |
          npm run build
          if [ "$PUBLIC_RELEASE" != true ] && grep -rli --include='*.html' cloudflareinsights dist; then
            echo "analytics beacon in a build that is not deployed" >&2; exit 1
          fi
          if [ "$PUBLIC_RELEASE" = true ]; then
            missing=$(find dist -name '*.html' -exec grep -L 'src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon="{&quot;token&quot;:&quot;[0-9a-f]\{32\}&quot;}"' {} + || true)
            if [ -n "$missing" ]; then
              echo "$missing"; echo "release build: pages above lack the analytics beacon" >&2; exit 1
            fi
          fi
      - name: Check every permalink in the built site
        run: node scripts/check-permalinks.mjs "$RUNNER_TEMP/openzfs" "$OPENZFS_SHA" $(find dist -name '*.html')
      - name: Check every source reference in the built site against SOURCES.md
        run: node scripts/check-sources.mjs SOURCES.md $(find dist -name '*.html')
      - name: Check the Content-Security-Policy against every inline script of the built site
        run: node scripts/check-csp.mjs public/_headers $(find dist -name '*.html')
      - name: Deploy
        if: vars.PUBLIC_RELEASE == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The secret CLOUDFLARE_API_TOKEN is not visible to this repository"
            exit 1
          fi
          if ! accounts="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts)"; then
            echo "::error::Cloudflare did not answer the account lookup"
            exit 1
          fi
          account="$(echo "$accounts" | jq -r 'if .success and (.result | length) == 1 and (.result[0].id | type) == "string" then .result[0].id else empty end')"
          if [ -z "$account" ]; then
            echo "::error::The token does not see exactly one Cloudflare account"
            exit 1
          fi
          echo "::add-mask::$account"
          export CLOUDFLARE_ACCOUNT_ID="$account"
          message="$(git log -1 --format=%s | head -c 100)"
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --message "$message"
